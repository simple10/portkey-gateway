name: Airship

# The checks Airship relies on for the commit it vendors (see AIRSHIP.md). Nightly too, so an advisory published
# against a runtime dependency shows up without a code change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airship-${{ github.event_name }}-${{ github.ref }}
  # Only PR runs cancel: every main commit (a tag candidate) keeps a finished run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Runtime dependency audit (must be clean)
        run: npm audit --omit=dev --package-lock-only

      - name: Install
        run: npm ci

      # Bundle size, not security: the `z` namespace object keeps all of zod 4 in the worker (AIRSHIP.md § Deviations).
      - name: Only src/amc/zod.ts imports zod
        run: |
          if grep -rnE "(from|import|require\()[[:space:]]*\(?[[:space:]]*['\"]zod(/[^'\"]*)?['\"]" src plugins \
              --include='*.ts' --include='*.mts' --include='*.js' --include='*.mjs' \
              | grep -v '^src/amc/zod.ts:' | grep -vE ':[[:space:]]*import type '; then
            echo '::error::import zod through src/amc/zod.ts (AIRSHIP.md § Deviations)'; exit 1
          fi

      # Includes src/amc/zod.test.ts: every z.<member> the gateway calls exists, and the schemas load and parse.
      - name: Airship tests (src/amc)
        run: npx jest src/amc

      - name: Worker build
        run: npx wrangler deploy --dry-run --outdir dist-check src/index.ts
